name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Typecheck, test, build, and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check formatting
        run: >-
          pnpm exec prettier --check README.md TODO.md plan.md package.json
          .github/workflows/ci.yml app.config.ts client/index.html
          client/public/manus-routes.json client/src/pages/Home.tsx
          client/src/components/PhotoComparison.tsx
          client/src/components/PhotoUploadPanel.tsx client/src/index.css
          server/_core/index.ts server/photoUpload.ts server/photoUpload.test.ts
          server/demoAssets.test.ts
